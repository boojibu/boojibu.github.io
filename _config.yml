title: boojibu
description: 백엔드와 데이터 엔지니어링에 관한 기록.
url: https://boojibu.github.io
baseurl: ""
lang: ko
timezone: Asia/Seoul
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
exclude:
  - AGENTS.md
  - README.md
  - templates
  - Gemfile
  - Gemfile.lock
  - vendor
