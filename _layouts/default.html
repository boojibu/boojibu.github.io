<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="header wrap">
    <a class="brand" href="{{ '/' | relative_url }}">boojibu<span>.dev</span></a>
    <nav aria-label="주 메뉴">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>글</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url == '/projects/' %}aria-current="page"{% endif %}>프로젝트</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>소개</a>
    </nav>
  </header>
  <main id="main" class="wrap" tabindex="-1">{{ content }}</main>
  <footer class="footer wrap">
    <span>© {{ site.time | date: '%Y' }} boojibu</span>
    <div><a href="https://github.com/boojibu">GitHub</a><a href="{{ '/feed.xml' | relative_url }}">RSS</a></div>
  </footer>
</body>
</html>
