name: Check blog build
on:
  pull_request:
  push:
    branches: ["feat/blog-foundation"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-artifact@v4
        with:
          name: blog-preview
          path: _site/
          retention-days: 7
