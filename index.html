---
layout: default
---
<header class="intro">
  <h1>boojibu</h1>
  <p>백엔드와 데이터 엔지니어링에 관한 기록.</p>
</header>

<section class="writing" aria-labelledby="writing-title" data-search-index="{{ '/search.json' | relative_url }}">
  <div class="section-heading">
    <h2 id="writing-title">글</h2>
    <span id="result-count" role="status" aria-live="polite">{{ site.posts.size }}편</span>
  </div>
  <form id="search-form" class="search-form" role="search" aria-label="글 검색" hidden>
    <div class="search-field">
      <label for="search-query">검색</label>
      <input id="search-query" name="q" type="search" placeholder="제목, 본문, 태그 검색" autocomplete="off" aria-controls="post-list">
    </div>
    <div class="filter-fields">
      <div>
        <label for="tag-filter">태그</label>
        <select id="tag-filter" name="tag" aria-controls="post-list">
          <option value="">전체 태그</option>
          {% assign sorted_tags = site.tags | sort %}
          {% for tag in sorted_tags %}<option value="{{ tag[0] | escape }}">{{ tag[0] | escape }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label for="project-filter">프로젝트</label>
        <select id="project-filter" name="project" aria-controls="post-list">
          <option value="">전체 프로젝트</option>
          {% assign sorted_projects = site.projects | sort: "title" %}
          {% for project in sorted_projects %}<option value="{{ project.project_id | escape }}">{{ project.title | escape }}</option>{% endfor %}
        </select>
      </div>
      <button type="button" id="reset-search" class="reset-button">초기화</button>
    </div>
  </form>
  <p id="search-error" class="search-message" role="status" hidden>검색을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요. 아래에서 전체 글을 볼 수 있습니다.</p>
  <noscript><p class="search-message">검색과 필터는 JavaScript를 켜면 사용할 수 있습니다. 전체 글은 아래에서 볼 수 있습니다.</p></noscript>
  {% include post-list.html posts=site.posts searchable=true %}
  <p id="no-results" class="empty" hidden>조건에 맞는 글이 없습니다. 검색어나 필터를 바꿔 보세요.</p>
  {% if site.posts.size == 0 %}<p class="empty" id="no-posts">아직 공개한 글이 없습니다.</p>{% endif %}
</section>
<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
